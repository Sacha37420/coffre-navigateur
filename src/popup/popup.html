<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Coffre du lab</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <section id="vault">
      <div id="v-aucun" hidden>
        <p>Aucun coffre dans ce navigateur.</p>
        <button class="primary" id="v-setup" type="button">Configurer le coffre</button>
      </div>
      <div id="v-verrouille" hidden>
        <label class="row"><input type="password" id="v-pass" placeholder="Phrase de passe" autocomplete="current-password" aria-label="Phrase de passe"></label>
        <div class="row">
          <button class="primary" id="v-unlock" type="button">Déverrouiller</button>
          <button id="v-manage1" type="button">Gérer</button>
        </div>
        <p id="v-error" class="alert danger" role="alert" hidden></p>
      </div>
      <div id="v-deverrouille" hidden>
        <p class="alert ok">Coffre ouvert.</p>
        <div class="row">
          <button class="primary" id="v-lock" type="button">Verrouiller</button>
          <button id="v-manage2" type="button">Gérer le coffre</button>
        </div>
      </div>
    </section>

    <h2>Générer un mot de passe</h2>
    <div class="row">
      <output id="pwd" aria-live="polite"></output>
    </div>
    <div class="row">
      <button id="regen" type="button">Nouveau</button>
      <button id="copy" type="button" class="primary">Copier</button>
    </div>
    <label class="row">Longueur <input id="length" type="range" min="8" max="64" value="20"> <span id="length-val">20</span></label>
    <fieldset>
      <legend>Caractères</legend>
      <label><input type="checkbox" id="lower" checked> minuscules</label>
      <label><input type="checkbox" id="upper" checked> majuscules</label>
      <label><input type="checkbox" id="digits" checked> chiffres</label>
      <label><input type="checkbox" id="symbols" checked> symboles</label>
      <label><input type="checkbox" id="avoidAmbiguous" checked> sans caractères ambigus (l, 1, O, 0…)</label>
    </fieldset>
    <p id="info" class="muted"></p>
  </main>
  <script type="module" src="popup.js"></script>
</body>
</html>
