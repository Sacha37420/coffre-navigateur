<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mes mots de passe — Coffre du lab</title>
  <link rel="stylesheet" href="pages.css">
  <link rel="stylesheet" href="entrees.css">
</head>
<body>
<main class="wide">
  <header>
    <h1>Mes mots de passe</h1>
    <nav class="actions">
      <button id="lock" type="button">Verrouiller</button>
      <a class="button" href="coffre.html">Gérer le coffre</a>
    </nav>
  </header>
  <div id="error" class="alert danger" role="alert" hidden></div>
  <p id="status" class="muted" aria-live="polite"></p>

  <section id="locked" hidden>
    <div class="card">
      <h2>Coffre verrouillé</h2>
      <p>Déverrouillez-le depuis l'icône du coffre ou depuis <a href="coffre.html">la page de gestion</a>.</p>
    </div>
  </section>

  <div id="layout" hidden>
    <section class="list-pane" aria-label="Liste">
      <div class="list-tools">
        <input type="search" id="q" placeholder="Rechercher (nom, site, identifiant)" aria-label="Rechercher" autocomplete="off">
        <button class="primary" id="new" type="button">Ajouter</button>
      </div>
      <p id="count" class="muted"></p>
      <ul id="list" class="entry-list"></ul>
    </section>

    <section class="detail-pane" aria-label="Fiche">
      <p id="empty-detail" class="muted">Choisissez une entrée, ou « Ajouter ».</p>
      <form id="form" hidden autocomplete="off">
        <h2 id="form-title"></h2>
        <label class="field"><span>Nom</span><input type="text" id="f-name" maxlength="200"></label>
        <label class="field"><span>Sites (un par ligne, par exemple <code>exemple.fr</code>)</span>
          <textarea id="f-origins" rows="2" spellcheck="false"></textarea></label>
        <label class="field"><span>Identifiant</span>
          <span class="with-buttons"><input type="text" id="f-username" maxlength="500" spellcheck="false">
            <button type="button" id="copy-user" title="Copier l'identifiant">Copier</button></span></label>
        <label class="field"><span>Mot de passe</span>
          <span class="with-buttons"><input type="password" id="f-password" maxlength="2000" spellcheck="false" autocomplete="new-password">
            <button type="button" id="show" aria-pressed="false">Afficher</button>
            <button type="button" id="copy-pwd">Copier</button>
            <button type="button" id="gen">Générer</button></span></label>
        <div id="reauth" class="card inset" hidden>
          <p>Pour afficher ce mot de passe, confirmez votre phrase de passe
            <span class="muted">(demandée quand elle n'a pas été saisie depuis 5 minutes)</span>.</p>
          <label class="field"><span>Phrase de passe</span><input type="password" id="reauth-pass" autocomplete="current-password"></label>
          <div class="actions"><button class="primary" type="button" id="reauth-go">Confirmer</button>
            <button type="button" id="reauth-cancel">Annuler</button></div>
        </div>
        <label class="field"><span>Notes</span><textarea id="f-notes" rows="3"></textarea></label>
        <div class="actions">
          <button class="primary" type="submit" id="save">Enregistrer</button>
          <button type="button" id="cancel">Annuler</button>
          <button type="button" class="danger" id="delete">Supprimer</button>
        </div>
        <p id="meta" class="muted"></p>
      </form>
    </section>
  </div>
</main>
<script type="module" src="entrees.js"></script>
</body>
</html>
