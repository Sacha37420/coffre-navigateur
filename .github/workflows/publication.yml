# Publication : sur une étiquette v<majeur>.<mineur>.<correctif> poussée, ou à la main (onglet
# Actions → publication → Run workflow, en donnant la version : l'étiquette est alors créée par la
# Release sur le commit choisi), tests, paquets, signature Firefox
# (si les secrets Mozilla sont posés), puis Release GitHub aux noms de fichier fixes — ce sont eux
# que pointent les liens « releases/latest/download/… » du README.
#
# Réglages du dépôt (Settings → Secrets and variables → Actions) :
#   variable LAB_URL         adresse du lab préremplie (par défaut : celle écrite plus bas), facultative
#   secret   AMO_JWT_ISSUER  clé d'API addons.mozilla.org (« JWT issuer »), facultative
#   secret   AMO_JWT_SECRET  secret associé ; sans ces deux secrets, Firefox est publié NON signé
#   secrets  ANDROID_KEYSTORE_B64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
#            clé de publication de l'application Android (keystore en base64) ; sans eux, pas d'APK
name: publication

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: "Version à publier (1.2.3) ; l'étiquette v1.2.3 est créée"
        required: true

permissions:
  contents: write

jobs:
  paquets:
    runs-on: ubuntu-24.04
    env:
      # Adresse du lab préremplie (décision du propriétaire : publique) ; la variable de dépôt LAB_URL la remplace.
      LAB_URL: ${{ vars.LAB_URL || 'https://sacha37420.hopto.org' }}
      AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
      AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
      ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
      TAG: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Version tirée de l'étiquette
        run: |
          [[ "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]] || { echo "Étiquette attendue : v1.2.3"; exit 1; }
          VERSION="${BASH_REMATCH[1]}"
          node -e "const f='package.json',p=require('./'+f);p.version=process.argv[1];require('fs').writeFileSync(f,JSON.stringify(p,null,2)+'\n')" "$VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Tests
        run: npm test

      - name: Construction et paquets
        run: npm run paquets

      - name: Contrôle Mozilla (web-ext lint)
        run: npx --yes web-ext@8.3.0 lint --source-dir dist/firefox --self-hosted

      - name: Signature Firefox (non listée)
        if: env.AMO_JWT_ISSUER != '' && env.AMO_JWT_SECRET != ''
        run: |
          npx --yes web-ext@8.3.0 sign --channel=unlisted --source-dir dist/firefox \
            --artifacts-dir signe --api-key="$AMO_JWT_ISSUER" --api-secret="$AMO_JWT_SECRET" \
            --approval-timeout 900000
          mv signe/*.xpi paquets/coffre-firefox.xpi
          rm paquets/coffre-firefox-non-signe.zip

      - uses: actions/setup-java@v4
        if: env.ANDROID_KEYSTORE_B64 != ''
        with:
          distribution: temurin
          java-version: '21'

      - name: Application Android (tests, construction signée)
        if: env.ANDROID_KEYSTORE_B64 != ''
        env:
          COFFRE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          COFFRE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          COFFRE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          export COFFRE_KEYSTORE="$RUNNER_TEMP/coffre.jks" COFFRE_VERSION="$VERSION"
          printf '%s' "$ANDROID_KEYSTORE_B64" | base64 -d > "$COFFRE_KEYSTORE"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null
          cd android
          ./gradlew --no-daemon :core:test :app:testDebugUnitTest :app:assembleRelease :app:lintRelease
          cp app/build/outputs/apk/release/app-release.apk ../paquets/coffre-android.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs ../paquets/coffre-android.apk \
            | grep 'SHA-256' | sed 's/.*: //' > ../empreinte-android.txt
          rm -f "$COFFRE_KEYSTORE"

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Coffre du lab $VERSION."
            echo
            echo "- coffre-chrome-edge.zip : Chrome et Edge, Linux et Windows (mode développeur, voir le README)."
            if [[ -f paquets/coffre-firefox.xpi ]]; then
              echo "- coffre-firefox.xpi : Firefox, Linux et Windows, signé par Mozilla (cliquer pour installer)."
            else
              echo "- coffre-firefox-non-signe.zip : Firefox, NON signé (secrets Mozilla absents) — module temporaire seulement."
            fi
            if [[ -f paquets/coffre-android.apk ]]; then
              echo "- coffre-android.apk : application Android (Android 8 et plus), à installer en autorisant les applis inconnues (voir le README)."
              echo "  Empreinte SHA-256 du certificat de signature : $(cat empreinte-android.txt)"
            else
              echo "- (pas d'APK : clé de publication Android absente des secrets)"
            fi
            echo
            echo "Adresse du lab préremplie : ${LAB_URL:-aucune}."
          } > notes.md
          # --target : en déclenchement manuel l'étiquette n'existe pas encore, la Release la crée ici.
          gh release create "$TAG" paquets/* --target "$GITHUB_SHA" --title "Coffre du lab $VERSION" --notes-file notes.md
